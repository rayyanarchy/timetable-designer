<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
    <title>Timetable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=SN+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/card.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./" aria-label="Timetable">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Timetable</span>
        </a>
        <div class="export" id="export"></div>
    </header>

    <main class="workspace">
        <section class="stage" aria-label="Your timetable">
            <div class="card-area" id="card-area"></div>
            <div class="controls" id="controls"></div>
        </section>
        <aside class="subjects" id="subjects" aria-label="Subjects"></aside>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
